syntax = "proto3";

package farm.internal.v1;

option go_package = "farm/server/gen/farm/v1;farmv1";

import "farm/public/v3/client.proto";

// ConnRef identifies a WebSocket connection on a specific Gateway instance.
message ConnRef {
  uint64 conn_id = 1;
  string gateway_id = 2;
}

// Empty is used for RPCs with no request or response payload.
message Empty {}

// ClientCommandRequest is the only Gateway-to-business-service request
// contract. Gateway authenticates the connection and supplies transport
// metadata, while Farm/Social own all command validation and business logic.
message ClientCommandRequest {
  uint64 uid = 1;
  ConnRef originator = 2;
  uint64 active_farm_uid = 3;
  uint64 route_uid = 4;
  farm.public.v3.WireEnvelope envelope = 5;
  // Gateway requests the opaque response fast path. Other internal callers
  // keep receiving a complete typed envelope by default.
  bool prefer_prepared = 6;
}

enum RoomAction {
  ROOM_ACTION_UNSPECIFIED = 0;
  ROOM_ACTION_SUBSCRIBE = 1;
  ROOM_ACTION_UNSUBSCRIBE = 2;
}

// ClientCommandResponse normally contains a complete typed public response.
// Hot paths may instead carry the already-marshaled public oneof body in
// prepared_payload; Gateway validates prepared_field and embeds those bytes
// directly in the final WebSocket frame without decoding business data.
// The room fields are transport instructions rather than business payloads.
message ClientCommandResponse {
  farm.public.v3.WireEnvelope envelope = 1;
  RoomAction room_action = 2;
  uint64 room_uid = 3;
  uint64 room_seq = 4;
  repeated farm.public.v3.WireEnvelope pushes = 5;
  bytes prepared_payload = 6;
  // WireEnvelope oneof field number: 13=EnterFarmResponse,
  // 14=SyncFarmResponse, 17=CommandResponse.
  uint32 prepared_field = 7;
}

// Shared command-stream batches amortize HTTP/2 metadata and protobuf framing
// for both Farm and Social hot paths while request_id preserves correlation.
message StreamExecuteRequest {
  uint64 request_id = 1;
  ClientCommandRequest request = 2;
  // Self SyncFarm is the dominant read path. These flat fields avoid building
  // ClientCommandRequest -> WireEnvelope -> SyncFarmRequest on both sides of
  // the trusted Gateway/Farm stream. request remains the compatibility and
  // non-self fallback; exactly one representation must be populated.
  uint64 fast_sync_uid = 3;
  uint32 fast_sync_client_seq = 4;
  uint64 fast_sync_from_seq = 5;
  uint64 fast_sync_conn_id = 6;
  string fast_sync_gateway_id = 7;
}

message StreamExecuteResponse {
  uint64 request_id = 1;
  ClientCommandResponse response = 2;
  // Flat success response for a flat self SyncFarm request. caught_up carries
  // only scalar state so the single Farm CPU does not allocate and marshal an
  // otherwise empty public response; Gateway builds that tiny public payload.
  uint32 fast_sync_client_seq = 3;
  uint64 fast_sync_uid = 4;
  uint64 fast_sync_farm_seq = 5;
  bytes fast_sync_prepared_payload = 6;
  bool fast_sync_caught_up = 7;
  int64 fast_sync_server_time = 8;
  string fast_sync_time_profile = 9;
}

message StreamExecuteBatchRequest {
  repeated StreamExecuteRequest requests = 1;
}

message StreamExecuteBatchResponse {
  repeated StreamExecuteResponse responses = 1;
}

// FriendCacheInvalidation is the binary Redis Pub/Sub contract used to keep
// Social replicas coherent. It is deliberately separate from the public
// FriendInvalidation stream, which only exposes the affected identities.
message FriendCacheInvalidation {
  string source = 1;
  uint64 uid = 2;
  uint64 peer_uid = 3;
  bool known = 4;
  bool value = 5;
}

// MailboxCacheInvalidation is the binary Redis Pub/Sub contract used to
// invalidate process-local mailbox views across Farm replicas.
message MailboxCacheInvalidation {
  uint64 uid = 1;
}
