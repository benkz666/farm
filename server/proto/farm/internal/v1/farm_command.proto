syntax = "proto3";

package farm.internal.v1;

option go_package = "farm/server/gen/farm/v1;farmv1";

import "farm/internal/v1/common.proto";
// FarmCommandService owns every Farm-facing client command. Gateway forwards
// the typed public envelope without translating business payloads.
service FarmCommandService {
  rpc Execute(ClientCommandRequest) returns (ClientCommandResponse);
  // AdvanceTask delivers a cross-shard Farm-owned side effect (for example,
  // advancing the visitor's task after entering a friend's farm).
  rpc AdvanceTask(AdvanceTaskRequest) returns (AdvanceTaskResponse);
  // ExecuteStream amortizes the per-command HTTP/2 stream and metadata cost.
  // request_id correlates responses because commands for different farms may
  // complete out of order; commands for one farm_uid remain ordered.
  rpc ExecuteStream(stream StreamExecuteRequest) returns (stream StreamExecuteResponse);
  // ExecuteBatchStream amortizes protobuf and HTTP/2 framing across unrelated
  // client commands while preserving request_id correlation.
  rpc ExecuteBatchStream(stream StreamExecuteBatchRequest) returns (stream StreamExecuteBatchResponse);
}

message AdvanceTaskRequest {
  uint64 uid = 1;
  uint32 task_id = 2;
  uint32 amount = 3;
}

message AdvanceTaskResponse {
  int32 err = 1;
}
