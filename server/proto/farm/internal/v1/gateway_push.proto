syntax = "proto3";

package farm.internal.v1;

option go_package = "farm/server/gen/farm/v1;farmv1";

import "farm/internal/v1/common.proto";
import "farm/public/v3/client.proto";

// GatewayPushService is a transport-only callback boundary. Application
// services construct the complete public Protobuf envelope; Gateway only
// resolves a local connection, enqueues bytes and applies connection-control
// directives.
service GatewayPushService {
  rpc PushFarmDeltaBatch(PushFarmDeltaBatchRequest) returns (Empty);
  rpc DeliverPush(DeliverPushRequest) returns (Empty);
  rpc PushSessionKick(PushSessionKickRequest) returns (Empty);
  rpc RevokeFarmAccess(RevokeFarmAccessRequest) returns (Empty);
}

message PushFarmDeltaBatchRequest {
  repeated uint64 conn_ids = 1;
  farm.public.v3.FarmDelta delta = 2;
}

message DeliverPushRequest {
  uint64 connection_id = 1;
  uint64 uid = 2;
  farm.public.v3.WireEnvelope envelope = 3;
}

message PushSessionKickRequest {
  uint64 connection_id = 1;
  uint64 uid = 2;
  int32 reason = 3;
}

message RevokeFarmAccessRequest {
  uint64 connection_id = 1;
  uint64 viewer_uid = 2;
  uint64 owner_uid = 3;
}
