syntax = "proto3";

package farm.internal.v1;

option go_package = "gen/farm/v1;farmv1";

import "farm/internal/v1/common.proto";

// GatewayPushService delivers pre-encoded client envelopes to local WebSocket
// connections. Gateways must not decode and re-encode envelope bytes.
service GatewayPushService {
  rpc PushFarmDeltaBatch(PushFarmDeltaBatchRequest) returns (Empty);
  rpc PushPlayerDelta(PushPlayerDeltaRequest) returns (Empty);
  rpc PushTaskNotify(PushTaskNotifyRequest) returns (Empty);
  rpc PushMailNotify(PushMailNotifyRequest) returns (Empty);
  rpc PushSessionKick(PushSessionKickRequest) returns (Empty);
}

message PushFarmDeltaBatchRequest {
  repeated uint64 conn_ids = 1;
  bytes envelope = 2;
}

message PushPlayerDeltaRequest {
  uint64 connection_id = 1;
  uint64 uid = 2;
  bytes delta_json = 3;
}

message Task {
  uint32 id = 1;
  int64 day_key = 2;
  string kind = 3;
  string title = 4;
  uint32 progress = 5;
  uint32 target = 6;
  int64 reward_coin = 7;
  bool claimed = 8;
}

message PushTaskNotifyRequest {
  uint64 connection_id = 1;
  uint64 uid = 2;
  Task task = 3;
}

message PushMailNotifyRequest {
  uint64 connection_id = 1;
  uint64 uid = 2;
  string kind = 3;
}

message PushSessionKickRequest {
  uint64 connection_id = 1;
  uint64 uid = 2;
  int32 reason = 3;
}
