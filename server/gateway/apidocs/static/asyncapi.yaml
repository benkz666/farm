operations:
  handshake:
    action: send
    channel: {$ref: '#/channels/farm'}
    summary: "Handshake 请求"
    x-command: 100
    x-performance-tier: ladder
    x-performance-scenario: ws_handshake
    x-performance-reason: "连接与会话注册"
    messages:
      - $ref: '#/channels/farm/messages/HandshakeRequest'
  receiveHandshakeResponse:
    action: receive
    channel: {$ref: '#/channels/farm'}
    summary: "Handshake 响应"
    messages:
      - $ref: '#/channels/farm/messages/HandshakeResponse'
  ping:
