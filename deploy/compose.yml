# 本地依赖默认始终启动：MySQL / Redis / Kafka。
# 双分片（farm-0/1 + gateway-0/1）使用 profile=shards：
#   docker compose -f deploy/compose.yml --profile shards up -d --build
# 或宿主机进程编排：./scripts/run.sh shards

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: farm
      MYSQL_DATABASE: farm
      MYSQL_USER: farm
      MYSQL_PASSWORD: farm
    ports: ["3306:3306"]
    command: ["--character-set-server=utf8mb4"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufarm", "-pfarm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- 期 4a 双分片（profile: shards）----
  # 拓扑：逻辑片 0..511 → farm-0，512..1023 → farm-1；客户端可连任意 Gateway。
  farm-0:
    profiles: ["shards"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment: &farm-env
      FARM_MYSQL_DSN: farm:farm@tcp(mysql:3306)/farm?parseTime=true&loc=Local
      FARM_REDIS_ADDR: redis:6379
      FARM_TOKEN_SECRET: dev-only-change-me
      FARM_INVITE_SECRET: dev-only-invite-change-me
      FARM_INTERNAL_TOKEN: dev-only-internal-token-change-me
      FARM_ROUTE_TABLE: deploy/route-table.example.json
      FARM_LOGICAL_SHARDS: "1024"
      FARM_BUS: kafka
      FARM_KAFKA_BROKERS: kafka:9092
      FARM_TIME_PROFILE: ${FARM_TIME_PROFILE:-demo}
      FARM_FARM_URLS: '{"farm-0":"http://farm-0:9100","farm-1":"http://farm-1:9101"}'
      FARM_GATEWAY_URLS: '{"gateway-0":"http://gateway-0:9200","gateway-1":"http://gateway-1:9201"}'
      FARM_ROLE: farm
      FARM_INSTANCE_ID: farm-0
      FARM_HTTP_ADDR: ":9100"
    ports: ["9100:9100"]

  farm-1:
    profiles: ["shards"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *farm-env
      FARM_ROLE: farm
      FARM_INSTANCE_ID: farm-1
      FARM_HTTP_ADDR: ":9101"
    ports: ["9101:9101"]

  gateway-0:
    profiles: ["shards"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      farm-0:
        condition: service_started
      farm-1:
        condition: service_started
    environment:
      <<: *farm-env
      FARM_ROLE: gateway
      FARM_INSTANCE_ID: gateway-0
      FARM_HTTP_ADDR: ":9200"
      FARM_ALLOW_DEBUG_TIME: "1"
    ports: ["9200:9200"]

  gateway-1:
    profiles: ["shards"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      farm-0:
        condition: service_started
      farm-1:
        condition: service_started
    environment:
      <<: *farm-env
      FARM_ROLE: gateway
      FARM_INSTANCE_ID: gateway-1
      FARM_HTTP_ADDR: ":9201"
      FARM_ALLOW_DEBUG_TIME: "1"
    ports: ["9201:9201"]
