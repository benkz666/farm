apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: farm
  labels:
    app.kubernetes.io/name: migrate
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: mysql-ready
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
          command:
            - /bin/sh
            - -c
          args:
            - |
              until MYSQL_PWD="${MYSQL_PASSWORD}" mysqladmin ping -h mysql -u"${MYSQL_USER}" --silent; do
                echo "等待 MySQL 就绪..."
                sleep 2
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: migrate
          image: farm/migrate:local
          imagePullPolicy: IfNotPresent
          env:
            - name: FARM_MYSQL_HOST
              value: mysql
            - name: FARM_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: FARM_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
            - name: FARM_MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_DATABASE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
