apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-data
  namespace: benkz
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-results
  namespace: benkz
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6
  namespace: benkz
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: k6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/part-of: farm
    spec:
      containers:
        - name: k6
          image: benkz/k6:k3s
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args: ["while true; do sleep 3600; done"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests: {cpu: "20", memory: 10Gi}
            limits: {cpu: "22", memory: 12Gi}
          volumeMounts:
            - {name: data, mountPath: /fixtures}
            - {name: results, mountPath: /results}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: bench-data}
        - name: results
          persistentVolumeClaim: {claimName: bench-results}
