apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: farm
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 9002
      targetPort: http
    - name: grpc
      port: 9202
      targetPort: grpc
    - name: admin
      port: 9302
      targetPort: admin
---
# 多 gateway 实例需要为每个实例维护显式的 ID -> DNS 目标映射；基线仍使用 gateway Service。
apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  namespace: farm
  labels:
    app.kubernetes.io/name: gateway
spec:
  clusterIP: "None"
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 9002
      targetPort: http
    - name: grpc
      port: 9202
      targetPort: grpc
    - name: admin
      port: 9302
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: farm
  labels:
    app.kubernetes.io/name: gateway
spec:
  # 基线保持单副本；gateway-hpa.yaml 单独 apply 后才启用自动扩缩。
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: farm/gateway:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: farm-common-env
            - configMapRef:
                name: farm-topology
          env:
            - name: FARM_GATEWAY_HTTP_ADDR
              value: ":9002"
            - name: FARM_GATEWAY_GRPC_ADDR
              value: ":9202"
            - name: FARM_GATEWAY_ADMIN_ADDR
              value: ":9302"
            # Deployment 的 Pod 名称不是稳定 ordinal，基线显式使用 gateway-0。
            - name: FARM_GATEWAY_INSTANCE_ID
              value: gateway-0
            - name: FARM_GATEWAY_GRPC_TARGETS
              value: '{"gateway-0":"gateway:9202"}'
            - name: FARM_SOCIAL_GRPC_TARGET
              value: socialsvr:9204
          ports:
            - name: http
              containerPort: 9002
            - name: grpc
              containerPort: 9202
            - name: admin
              containerPort: 9302
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: route-table
              mountPath: /app/deploy/route-table.json
              subPath: route-table.json
              readOnly: true
      volumes:
        - name: route-table
          configMap:
            name: farm-route-table
            items:
              - key: route-table.json
                path: route-table.json
