apiVersion: v1
kind: Service
metadata:
  name: farmsvr
  namespace: farm
  labels:
    app.kubernetes.io/name: farmsvr
spec:
  clusterIP: "None"
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: farmsvr
  ports:
    - name: http
      port: 9100
      targetPort: http
    - name: grpc
      port: 9210
      targetPort: grpc
    - name: admin
      port: 9310
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: farmsvr
  namespace: farm
  labels:
    app.kubernetes.io/name: farmsvr
spec:
  serviceName: farmsvr
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: farmsvr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: farmsvr
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: farmsvr
          image: farm/farmsvr:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              ordinal="${HOSTNAME##*-}"
              export FARM_FARM_INSTANCE_ID="farm-${ordinal}"
              exec /app/service
          envFrom:
            - secretRef:
                name: farm-common-env
            - configMapRef:
                name: farm-topology
          env:
            - name: FARM_FARM_HTTP_ADDR
              value: ":9100"
            - name: FARM_FARM_GRPC_ADDR
              value: ":9210"
            - name: FARM_FARM_ADMIN_ADDR
              value: ":9310"
            - name: FARM_GATEWAY_GRPC_TARGETS
              value: '{"gateway-0":"gateway:9202"}'
            - name: FARM_SOCIAL_GRPC_TARGET
              value: socialsvr:9204
          ports:
            - name: http
              containerPort: 9100
            - name: grpc
              containerPort: 9210
            - name: admin
              containerPort: 9310
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: route-table
              mountPath: /app/deploy/route-table.json
              subPath: route-table.json
              readOnly: true
      volumes:
        - name: route-table
          configMap:
            name: farm-route-table
            items:
              - key: route-table.json
                path: route-table.json
