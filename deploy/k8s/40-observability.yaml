apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: benkz
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: benkz-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: benkz-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benkz-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: benkz
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: benkz
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: benkz
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - {name: http, port: 9090, targetPort: 9090, nodePort: 30909}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: benkz
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: farm
    spec:
      serviceAccountName: prometheus
      securityContext: {fsGroup: 65534}
      containers:
        - name: prometheus
          image: benkz/prometheus:k3s
          imagePullPolicy: Never
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-remote-write-receiver
          ports:
            - {name: http, containerPort: 9090}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: benkz
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: benkz
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: http, port: 3000, targetPort: 3000, nodePort: 30300}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: benkz
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: farm
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: benkz/grafana:k3s
          imagePullPolicy: Never
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
  namespace: benkz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysqld-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysqld-exporter
        app.kubernetes.io/part-of: farm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9104"
    spec:
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.14.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATA_SOURCE_NAME, value: "farm:farm@tcp(mysql:3306)/"}
          ports:
            - {name: metrics, containerPort: 9104}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: benkz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
