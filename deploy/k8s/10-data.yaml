apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: benkz
  labels:
    app.kubernetes.io/name: mysql
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: benkz
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: farm
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --max-connections=1000
            - --innodb-buffer-pool-size=3G
            # 单节点压测的磁盘会先于 CPU 饱和，而 MySQL 是投影落盘的唯一权威。
            # 用 1 秒内的事务丢失风险换掉每事务两次 fsync，并让数据页写入减半。
            - --innodb-flush-log-at-trx-commit=2
            - --sync-binlog=0
            - --innodb-doublewrite=OFF
            # redo 容量的 100MB 默认值撑不住持续写入：6MB/s 就会让 InnoDB 不断被
            # 迫推进检查点，把写事务拖成排队。给一轮长稳留足空间。
            - --innodb-redo-log-capacity=8589934592
            # 保留 binlog，提交路径的写放大成本仍计入容量结论；但必须限制单文件
            # 大小与保留时长，否则会累积撑爆节点磁盘并触发 kubelet 驱逐。
            - --max-binlog-size=134217728
            - --binlog-expire-logs-seconds=1800
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: farm-secrets, key: mysql-root-password}
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef: {name: farm-secrets, key: mysql-database}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: farm-secrets, key: mysql-user}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: farm-secrets, key: mysql-password}
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: benkz
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: benkz
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: farm
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
