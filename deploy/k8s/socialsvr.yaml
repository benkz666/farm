apiVersion: v1
kind: Service
metadata:
  name: socialsvr
  namespace: farm
  labels:
    app.kubernetes.io/name: socialsvr
spec:
  selector:
    app.kubernetes.io/name: socialsvr
  ports:
    - name: http
      port: 9004
      targetPort: http
    - name: grpc
      port: 9204
      targetPort: grpc
    - name: admin
      port: 9304
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialsvr
  namespace: farm
  labels:
    app.kubernetes.io/name: socialsvr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: socialsvr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialsvr
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: socialsvr
          image: farm/socialsvr:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: farm-common-env
          env:
            - name: FARM_SOCIAL_HTTP_ADDR
              value: ":9004"
            - name: FARM_SOCIAL_GRPC_ADDR
              value: ":9204"
            - name: FARM_SOCIAL_ADMIN_ADDR
              value: ":9304"
          ports:
            - name: http
              containerPort: 9004
            - name: grpc
              containerPort: 9204
            - name: admin
              containerPort: 9304
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
