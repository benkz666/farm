upstream farm_gateways {
    least_conn;
    server gateway-1:9002;
    server gateway-2:9002;
    server gateway-3:9002;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 保留浏览器原始 Host，使 Gateway 返回的 ws_url 指向前端同源地址。
    location /api/ {
        proxy_pass http://farm_gateways;
        proxy_http_version 1.1;
        # $host 会移除非默认端口；必须透传浏览器的 Host，
        # 否则 Gateway 生成的 ws_url 会错误地落到 80 端口。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 文档由 Gateway 在 dev + FARM_ENABLE_API_DOCS=1 时提供。
    location = /docs {
        proxy_pass http://farm_gateways;
        proxy_set_header Host $http_host;
    }

    location /docs/ {
        proxy_pass http://farm_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://farm_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Vue Router 的 history 路由回退到入口页面。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
