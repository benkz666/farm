global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# The remote-write receiver is enabled by the Prometheus command in compose.yml:
# --web.enable-remote-write-receiver. k6 can POST samples to /api/v1/write.
scrape_configs:
  - job_name: farm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-1:9302", "gateway-2:9302", "gateway-3:9302"]

  - job_name: farm
    metrics_path: /metrics
    static_configs:
      - targets: ["farm:9310"]

  - job_name: social
    metrics_path: /metrics
    static_configs:
      - targets: ["social:9304"]

  - job_name: mysqld-exporter
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: event-redis-exporter
    static_configs:
      - targets: ["event-redis-exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
